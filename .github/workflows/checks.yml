name: checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/checks.yml
      # Only what the code imports; scipy, fonts and ffmpeg are optional (video tests skip without ffmpeg).
      - run: pip install numpy opencv-python-headless Pillow
      - run: python tests/run_tests.py

name: checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install numpy opencv-python-headless Pillow scipy
      - name: CLI help
        run: python skills/video-to-physics/scripts/v2p.py -h
      - name: Tests
        run: python tests/run_tests.py
